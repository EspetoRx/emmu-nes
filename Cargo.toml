[package]
name = "emmu-nes"
version = "0.1.0"
edition = "2024"
description = "Emmu NES WebAssembly core"
repository = "https://github.com/EspetoRx/emmu-nes"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tetanes-core = { path = "../tetanes-core" }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
